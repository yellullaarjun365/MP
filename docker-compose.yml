services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aqualife_postgres
    restart: always
    environment:
      POSTGRES_USER: aqualife
      POSTGRES_PASSWORD: aqualife_dev_pw
      POSTGRES_DB: aqualife
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aqualife_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
